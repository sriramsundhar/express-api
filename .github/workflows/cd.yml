name: CD
on:
  workflow_dispatch:
jobs:
  deployStaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GKE_SA_KEY }}'
      - name: Get cluster credentials
        id: get-credentials
        uses: google-github-actions/get-gke-credentials@main
        with:
          cluster_name: <clustername>
          location: <region>
      - name: Extract version from package.json
        uses: sergeysova/jq-action@v2
        id: version
        with:
          cmd: 'jq .version package.json -r'
      - name: yq - portable yaml processor
        uses: mikefarah/yq@v4.44.3
        with:
          cmd: yq -i '.appVersion = "${{ steps.version.outputs.value }}"' ./iac/helm/Chart.yaml
      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.14.4
      - name: Dry run stading deployment
        run: |
          echo 'deploying to staging'
          helm upgrade --install --dry-run --debug staging-express-api ./iac/helm -f ./iac/helm/env/staging.yaml
      - run: |
          echo 'deploying to staging'
          helm upgrade --wait --install staging-express-api ./iac/helm -f ./iac/helm/env/staging.yaml
  approveProd:
    needs: deployStaging
    runs-on: ubuntu-latest
    steps:
      - uses: trstringer/manual-approval@v1.9.1
        timeout-minutes: 1
        with:
          secret: ${{ github.TOKEN }}
          approvers: sriramsundhar
          minimum-approvals: 1
          issue-title: 'Deploying ${{github.ref_name}} to prod from staging'
          issue-body: 'Please approve or deny the deployment of version ${{github.ref_name}}.'
          exclude-workflow-initiator-as-approver: false

  deployProd:
    runs-on: ubuntu-latest
    needs: approveProd
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo 'deploying to prod'
